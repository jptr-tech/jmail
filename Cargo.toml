[workspace]
resolver = "2"
members = ["crates/jmail-core", "crates/jmail-ui", "crates/jmail-mock-imap"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/jptr/jmail"
authors = ["jptr"]

[workspace.dependencies]
jmail-core = { path = "crates/jmail-core" }
async-channel = "2"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
async-trait = "0.1"
futures-util = "0.3"
imap-proto = "0.17"
keyring = "4"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
rcgen = "0.14"
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
webkit6 = "0.6"
webpki-roots = "1"
zbus = "5"

[profile.release]
lto = true
codegen-units = 1
strip = true
